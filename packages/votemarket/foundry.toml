[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc = "0.8.28"
evm_version = "shanghai"
prompt_timeout = 120

# Enables to use python scripts in forge tests.
ffi = true

verbosity = 2
optimizer_runs = 200

gas_reports = ["Votemarket"]

[fuzz]
max_test_rejects = 1_000_000 # Number of times `vm.assume` can fail


[etherscan]
bnb = { key = "${BNBSCAN_KEY}" }
frax = { key = "${FRAXSCAN_KEY}" }
base = { key = "${BASESCAN_KEY}" }
mainnet = { key = "${ETHERSCAN_KEY}" }
arbitrum = { key = "${ARBISCAN_KEY}" }
optimism = { key = "${OPTIMISTICSCAN_KEY}" }
zksync = { key = "${ZKSYNCSCAN_KEY}" }
polygon = { key = "${POLYGONSCAN_KEY}" }
polygonzkevm = { key = "${POLYGONZKSCAN_KEY}" }


[rpc_endpoints]
mainnet = "https://rpc.stakedao.org/main/evm/1"
base = "https://rpc.stakedao.org/base/evm/8453"
arbitrum = "https://rpc.stakedao.org/arbitrum/evm/42161"
optimism = "https://rpc.stakedao.org/optimism/evm/10"
frax = "https://rpc.stakedao.org/fraxtal/evm/252"
sonic = "https://rpc.stakedao.org/sonic/evm/146"
bnb = "https://rpc.stakedao.org/bsc/evm/56"
etherlink = "https://rpc.stakedao.org/etherlink/evm/42793"
polygon = "https://rpc.stakedao.org/polygon/evm/137"
linea = "https://rpc.stakedao.org/linea/evm/59144"
taiko = "https://rpc.stakedao.org/taiko/evm/167000"
sepolia = "https://sepolia.gateway.tenderly.co"
base-sepolia = "https://base-sepolia.gateway.tenderly.co"
zksync = "https://zksync-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
polygonzkevm = "https://polygonzkevm-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
